<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nostr.buzz</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    html, body {
      height: 100%; 
      overflow-x: hidden; 
    }
    body {
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      text-align: center;
      padding: 1rem; 
    }
    .logo-container {
      position: relative; 
      width: 300px; 
      max-width: 80%; 
      aspect-ratio: 1 / 1; 
      background-image: url('logo.png');
      background-size: contain; 
      background-repeat: no-repeat;
      background-position: center;
      margin-bottom: 1.5rem;
      z-index: 1; 
    }
    
    .logo-container::after {
      content: '';
      position: absolute;
      bottom: -5px; 
      left: 50%;
      transform: translateX(-50%);
      width: 90%; 
      height: 30px; 
      background: radial-gradient(ellipse at center, rgba(252, 211, 77, 0.6) 0%, rgba(252, 211, 77, 0) 70%);
      filter: blur(15px); 
      z-index: 0; 
      transition: opacity 0.3s ease-in-out;
    }
    
    .logo-container::before {
      content: '';
      position: absolute;
      
      left: var(--mouse-x, 50%);
      top: var(--mouse-y, 50%);
      transform: translate(-50%, -50%); 
      width: 120px; 
      height: 120px; 
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 65%);
      border-radius: 50%;
      filter: blur(25px); 
      z-index: 0; 
      pointer-events: none; 
      opacity: 0; 
      transition: opacity 0.2s ease-out; 
    }
    
    .logo-container:hover::before {
      opacity: 1;
    }
    
    /* .logo-container:hover::after {
      opacity: 0;
    } */

    h1 {
      font-size: 2rem; 
      font-weight: 800;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1rem; 
      max-width: 90%; 
      margin-bottom: 1.5rem; 
      color: #cfcfcf;
    }
    .cta {
      background-color: #fcd34d;
      color: #000;
      padding: 0.7rem 1.3rem; 
      border-radius: 8px; 
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s;
      font-size: 1rem; 
    }
    .cta:hover {
      background-color: #fbbf24;
    }

    
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .shake {
      
      animation: shake 0.8s cubic-bezier(.36,.07,.19,.97) both;
    }

    
    @media (min-width: 600px) {
      .logo-container {
        width: 320px; 
      }
      h1 {
        font-size: 2.5rem; 
      }
      p {
        font-size: 1.2rem;
        max-width: 600px; 
      }
      .cta {
        padding: 0.8rem 1.5rem;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  
  <div class="logo-container" aria-label="nostr.buzz logo"></div>
  <h1>Welcome to nostr.buzz</h1>
  
  <a href="#" class="cta">Buzz</a>

  <audio id="buzzSound" src="buzz.mp3" preload="auto"></audio>

  <script>
    
    const logoContainer = document.querySelector('.logo-container');
    const ctaButton = document.querySelector('.cta');
    const buzzSound = document.getElementById('buzzSound');
    const body = document.body;

    
    logoContainer.addEventListener('mousemove', (e) => {
      const rect = logoContainer.getBoundingClientRect();
      
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      logoContainer.style.setProperty('--mouse-x', `${x}px`);
      logoContainer.style.setProperty('--mouse-y', `${y}px`);
    });

    
    logoContainer.addEventListener('mouseleave', () => {
      
      logoContainer.style.setProperty('--mouse-x', `50%`);
      logoContainer.style.setProperty('--mouse-y', `50%`);
    });

    
    ctaButton.addEventListener('click', (event) => {
      event.preventDefault(); 

      
      buzzSound.currentTime = 0; 
      buzzSound.play().catch(error => {
        console.error("Audio playback failed:", error);
        
      });

      
      body.classList.add('shake');

      
      
      setTimeout(() => {
        body.classList.remove('shake');
      }, 800); 
      
    });
  </script>
</body>
</html>
