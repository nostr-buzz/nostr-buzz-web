<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nostr.buzz</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    html, body {
      height: 100%;
      overflow-x: hidden;
    }
    body {
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
      position: relative; /* Needed for absolute positioning of game area */
    }
    .logo-container {
      position: relative;
      width: 300px;
      max-width: 80%;
      aspect-ratio: 1 / 1;
      background-image: url('logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      margin-bottom: 1.5rem;
      z-index: 1;
    }

    .logo-container::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 30px;
      background: radial-gradient(ellipse at center, rgba(252, 211, 77, 0.6) 0%, rgba(252, 211, 77, 0) 70%);
      filter: blur(15px);
      z-index: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .logo-container::before {
      content: '';
      position: absolute;

      left: var(--mouse-x, 50%);
      top: var(--mouse-y, 50%);
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 65%);
      border-radius: 50%;
      filter: blur(25px);
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }

    .logo-container:hover::before {
      opacity: 1;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1rem;
      max-width: 90%;
      margin-bottom: 1.5rem;
      color: #cfcfcf;
    }
    .slogan {
      font-family: 'Pacifico', cursive; /* Fun, cursive font */
      font-size: 1.5em;
      font-weight: bold; /* Adjusted from 1.3em */
      color: #fcd34d;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
      margin-top: 1rem; /* Add some space above */
      margin-bottom: 2rem; /* Add space below */
    }
    .cta {
      background-color: #fcd34d;
      color: #000;
      padding: 0.7rem 1.3rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s;
      font-size: 1rem;
      margin-bottom: 3rem; /* Add space below button */
    }
    .cta:hover {
      background-color: #fbbf24;
    }


    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .shake {
      animation: shake 0.8s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Bee Game Styles */
    #bee-game-area {
      margin-top: auto; /* Push to bottom */
      padding: 20px;
      border-top: 1px dashed #555;
      width: 100%;
      max-width: 600px; /* Limit width */
      position: relative; /* Context for absolute bee */
      min-height: 150px; /* Ensure space for the bee */
      display: flex; /* Use flexbox for centering */
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #bee-game-area p {
        margin-bottom: 10px;
        font-size: 0.9rem;
        color: #aaa;
    }
    #moving-bee {
      position: absolute;
      font-size: 2.5rem; /* Make bee bigger */
      cursor: pointer;
      user-select: none; /* Prevent text selection */
      /* Dynamic transition duration will be set via JS */
      transition: top 0.3s ease-out, left 0.3s ease-out;
      z-index: 10;
    }
     #catch-message {
        font-size: 1.2rem;
        color: #fcd34d;
        font-weight: bold;
        margin-top: 10px;
        display: none; /* Hidden initially */
        cursor: pointer; /* Indicate it's clickable for restart */
     }
     #score-display {
        position: absolute;
        top: 5px;
        right: 10px;
        font-size: 1rem;
        color: #fcd34d;
        font-weight: bold;
     }

    @media (min-width: 600px) {
      .logo-container {
        width: 320px;
      }
      h1 {
        font-size: 2.5rem;
      }
      p {
        font-size: 1.2rem;
        max-width: 600px;
      }
       .slogan {
         font-size: 1.8em; 
       }
      .cta {
        padding: 0.8rem 1.5rem;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="logo-container" aria-label="nostr.buzz logo"></div>
  <h1>Welcome to nostr.buzz</h1>
  <p>Get ready for something exciting! We're building a new buzz in the Nostr universe. Stay tuned!</p>
  <p class="slogan">The future is buzzing! 🐝</p>
  <a href="#" class="cta">Buzz</a>

  <audio id="buzzSound" src="buzz.mp3" preload="auto"></audio>

  <div id="bee-game-area">
      <div id="score-display">Score: 0</div>
      <p>Quick! Catch the buzzing bee as many times as you can!</p>
      <span id="moving-bee">🐝</span>
      <div id="catch-message">Gotcha! Click me to play again! 😉</div>
  </div>

  <script>
    
    const logoContainer = document.querySelector('.logo-container');
    const ctaButton = document.querySelector('.cta');
    const buzzSound = document.getElementById('buzzSound');
    const body = document.body;

    
    logoContainer.addEventListener('mousemove', (e) => {
      const rect = logoContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      logoContainer.style.setProperty('--mouse-x', `${x}px`);
      logoContainer.style.setProperty('--mouse-y', `${y}px`);
    });
    logoContainer.addEventListener('mouseleave', () => {
      logoContainer.style.setProperty('--mouse-x', `50%`);
      logoContainer.style.setProperty('--mouse-y', `50%`);
    });


    
    ctaButton.addEventListener('click', (event) => {
      event.preventDefault();
      buzzSound.currentTime = 0;
      buzzSound.play().catch(error => {
        console.error("Audio playback failed:", error);
      });
      body.classList.add('shake');
      setTimeout(() => {
        body.classList.remove('shake');
      }, 800);
    });

    
    const gameArea = document.getElementById('bee-game-area');
    const bee = document.getElementById('moving-bee');
    const catchMessage = document.getElementById('catch-message');
    const scoreDisplay = document.getElementById('score-display');

    let beeInterval = null;
    let beeCaught = false;
    let score = 0;
    let currentMoveInterval = 1500; 
    const minMoveInterval = 300; 
    const intervalDecrease = 100; 

    function updateScore() {
        scoreDisplay.textContent = `Score: ${score}`;
    }

    function moveBee() {
        if (beeCaught) return;

        const areaRect = gameArea.getBoundingClientRect();
        
        const padding = 20; 
        const beeRect = bee.getBoundingClientRect();

        
        const maxX = areaRect.width - beeRect.width - (padding * 2);
        const maxY = areaRect.height - beeRect.height - (padding * 2);

        
        const randomX = Math.max(0, Math.random() * maxX) + padding;
        const randomY = Math.max(0, Math.random() * maxY) + padding;

        
        const transitionDuration = Math.max(0.1, (currentMoveInterval / 3) / 1000); 
        bee.style.transition = `top ${transitionDuration}s ease-out, left ${transitionDuration}s ease-out`;

        bee.style.left = `${randomX}px`;
        bee.style.top = `${randomY}px`;
    }

    function startGame() {
        beeCaught = false;
        catchMessage.style.display = 'none';
        bee.style.opacity = 1;
        bee.style.cursor = 'pointer'; 

        
        if (score === 0) {
            currentMoveInterval = 1500; 
        } else {
            
            currentMoveInterval = Math.max(minMoveInterval, currentMoveInterval - intervalDecrease);
        }

        updateScore(); 

        if (beeInterval) clearInterval(beeInterval);
        beeInterval = setInterval(moveBee, currentMoveInterval);
        moveBee(); 
    }

    bee.addEventListener('click', () => {
        if (!beeCaught) {
            beeCaught = true;
            clearInterval(beeInterval);
            score++; 
            updateScore(); 

            catchMessage.style.display = 'block'; 
            bee.style.opacity = 0.6; 
            bee.style.cursor = 'default'; 

            
        }
    });

    
    catchMessage.addEventListener('click', () => {
        if (beeCaught) { 
             startGame();
        }
    });

    
    updateScore(); 
    startGame();

  </script>
</body>
</html>
